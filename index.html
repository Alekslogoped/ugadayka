<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай по признакам</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  padding: 12px;
  display: grid;
  place-items: center;
  background: #eaf4f8;
  font-family: Arial, sans-serif;
  color: #23364e;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 4px solid #ffbc45;
  outline-offset: 4px;
}

/*
  Вся игра масштабируется вместе с монитором.
  Размеры внутреннего макета: 1680 × 945.
*/

.game-shell {
  position: relative;
  width: 100%;
  max-width: 1400px;
}

.game {
  position: absolute;
  top: 0;
  left: 0;
  width: 1680px;
  height: 945px;
  transform-origin: top left;
}

.monitor-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Положение игрового поля внутри изображения монитора */

.screen {
  position: absolute;
  left: 11%;
  top: 11.5%;
  width: 78%;
  height: 63%;
  padding: 18px 24px;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

h1 {
  margin: 0;
  font-size: 42px;
}

.counter {
  padding: 9px 20px;
  border-radius: 20px;
  background: #eaf0ff;
  font-size: 24px;
  font-weight: bold;
  white-space: nowrap;
}

.instruction {
  margin: 9px 0;
  font-size: 23px;
  color: #65758b;
  line-height: 1.3;
}

/* Лапки прогресса */

.progress {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 0 0 8px;
}

.paw {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  color: #cbd5e1;
  transition: color .3s, transform .3s;
}

.paw svg {
  width: 30px;
  height: 30px;
  fill: currentColor;
}

.paw.current {
  color: #9298eb;
  background: #ededff;
  border-radius: 50%;
}

.paw.done {
  color: #eea34c;
  transform: rotate(-8deg);
}

.paw.done:nth-child(even) {
  color: #77bea0;
  transform: rotate(8deg);
}

/* Основное поле */

.board {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 45px;
}

.clues {
  display: grid;
  gap: 18px;
}

.clue {
  padding: 20px 12px;
  text-align: center;
  font-size: 40px;
  font-weight: bold;
  background: #e8e8ff;
  border: 2px solid #d4d2ff;
  border-radius: 19px;
}

.clue:nth-child(2) {
  background: #e4f5ee;
  border-color: #c5e9d9;
}

.clue:nth-child(3) {
  background: #fff0d6;
  border-color: #f7dfb4;
}

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .clue:hover {
    animation: clueShake .55s ease-in-out;
  }
}

@keyframes clueShake {
  0%, 100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-2px) rotate(-1deg); }
  40% { transform: translateX(2px) rotate(1deg); }
  60% { transform: translateX(-2px) rotate(-.7deg); }
  80% { transform: translateX(1px) rotate(.5deg); }
}

/* Коробка */

.answer {
  position: relative;
  width: 100%;
  height: 355px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #23364e;
  background: #edf3ff;
  border: 0;
  border-radius: 24px;
  overflow: hidden;
  transition: background .3s;
}

.answer.revealed {
  background: #f3faf6;
  cursor: default;
}

.answer.shaking,
.answer.loading { cursor: wait; }

.answer-label {
  min-height: 36px;
  font-size: 30px;
  font-weight: bold;
}

.hint {
  min-height: 25px;
  font-size: 18px;
  color: #687b97;
  line-height: 1.2;
}

.box-stage {
  position: relative;
  width: 280px;
  height: 270px;
  flex-shrink: 0;
}

.box-scene {
  position: absolute;
  inset: 0;
}

.box-body {
  position: absolute;
  z-index: 3;
  left: 40px;
  bottom: 0;
  width: 200px;
  height: 95px;
  background: #e9af68;
  border: 4px solid #bd7b3f;
  border-radius: 5px 5px 15px 15px;
  box-shadow: inset -18px 0 #d99a55;
}

.box-body::after {
  content: "?";
  position: absolute;
  inset: 8px;
  text-align: center;
  font-size: 58px;
  font-weight: bold;
  color: #fff3de;
}

.box-lid {
  position: absolute;
  z-index: 4;
  left: 30px;
  bottom: 87px;
  width: 220px;
  height: 30px;
  background: #f7c785;
  border: 4px solid #bd7b3f;
  border-radius: 7px;
  transform-origin: 10% 80%;
  transition: transform .5s ease, opacity .5s ease;
}

/* Картинка целиком помещается в сцену */

.box-hero {
  position: absolute;
  z-index: 2;
  left: 20px;
  bottom: 15px;
  width: 240px;
  height: 205px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transform: translateY(55px) scale(.45);
  transform-origin: bottom center;
  transition: transform .75s ease-out, opacity .3s ease;
}

.box-hero img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.answer.revealed .box-hero {
  opacity: 1;
  transform: translateY(-40px) scale(1);
}

.answer.revealed .box-lid {
  transform: translate(-25px, -65px) rotate(-35deg);
  opacity: 0;
}

.answer.revealed .box-body::after {
  content: "★";
  font-size: 50px;
}

.shaking .box-scene {
  animation: boxShake .65s ease-in-out;
}

@keyframes boxShake {
  0%, 100% { transform: rotate(0); }
  15%, 45%, 75% {
    transform: translateX(-7px) rotate(-5deg);
  }
  30%, 60%, 90% {
    transform: translateX(7px) rotate(5deg);
  }
}

/* Искорки */

.sparkles {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

.spark {
  position: absolute;
  color: var(--color);
  font-size: var(--size);
  opacity: 0;
  animation: sparkle 1.1s ease-out forwards;
  animation-delay: var(--delay);
}

@keyframes sparkle {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.2);
  }
  25%, 65% { opacity: 1; }
  100% {
    opacity: 0;
    transform:
      translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
      scale(1.1)
      rotate(70deg);
  }
}

/* Кнопки внутри экрана */

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 8px;
}

.nav {
  padding: 10px 25px;
  font-size: 23px;
  font-weight: bold;
  color: white;
  background: #5b64dc;
  border: 0;
  border-radius: 14px;
}

.nav:disabled {
  opacity: .4;
  cursor: default;
}

.back {
  color: #354761;
  background: #e9edf4;
}

/* Финал */

.end {
  grid-column: 1 / -1;
  text-align: center;
}

.symbol {
  font-size: 85px;
  line-height: 1.2;
}

.end h2 {
  margin: 15px 0;
  font-size: 48px;
}

.end p {
  margin: 10px 0;
  font-size: 28px;
}

@media (prefers-reduced-motion: reduce) {
  .shaking .box-scene { animation: none; }
  .sparkles { display: none; }

  .box-lid,
  .box-hero,
  .paw,
  .answer { transition: none; }
}
</style>
</head>

<body>
<main class="game-shell" id="gameShell">
  <div class="game" id="game">
    <img
      class="monitor-image"
      src="images/monitor.png"
      alt=""
      aria-hidden="true"
      draggable="false">

    <section class="screen">
      <header>
        <h1>Угадай по признакам</h1>
        <span class="counter" id="counter"></span>
      </header>

      <p class="instruction" id="instruction">
        Прочитай три слова. Назови героя и нажми на коробку.
      </p>

      <div
        class="progress"
        id="progress"
        role="img"
        aria-label="Прогресс игры">
      </div>

      <div class="board" id="board"></div>

      <footer>
        <button class="nav back" id="back">Назад</button>
        <button class="nav" id="next" disabled>Дальше →</button>
      </footer>
    </section>
  </div>
</main>

<script>
// Файлы находятся в папке images:
// monitor.png — монитор
// pik-1.png ... pik-8.png — животные

const rounds = [
  {
    clues: ["Длинноухий", "Пугливый", "Прыткий"],
    answer: "Заяц",
    image: "images/pik-1.png"
  },
  {
    clues: ["Рыжая", "Хитрая", "Пушистая"],
    answer: "Лиса",
    image: "images/pik-2.png"
  },
  {
    clues: ["Серый", "Хищный", "Зубастый"],
    answer: "Волк",
    image: "images/pik-3.png"
  },
  {
    clues: ["Бурый", "Косолапый", "Крупный"],
    answer: "Медведь",
    image: "images/pik-4.png"
  },
  {
    clues: ["Маленький", "Колючий", "Сопящий"],
    answer: "Ёж",
    image: "images/pik-5.png"
  },
  {
    clues: ["Рыжая", "Прыгучая", "Запасливая"],
    answer: "Белка",
    image: "images/pik-6.png"
  },
  {
    clues: ["Полосатый", "Хищный", "Усатый"],
    answer: "Тигр",
    image: "images/pik-7.png"
  },
  {
    clues: ["Гривастый", "Могучий", "Грозный"],
    answer: "Лев",
    image: "images/pik-8.png"
  }
];

const $ = id => document.getElementById(id);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

let index = 0;
let opened = false;
let finished = false;
let busy = false;

const completed = new Set();
const imageCache = new Map();

// Масштабирование монитора и всех элементов одновременно

function resizeGame() {
  const width = $("gameShell").clientWidth;
  const scale = width / 1680;

  $("game").style.transform = `scale(${scale})`;
  $("gameShell").style.height = `${945 * scale}px`;
}

new ResizeObserver(resizeGame).observe($("gameShell"));
resizeGame();

const pawSvg = `
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <ellipse cx="9" cy="14" rx="4.5" ry="6"
      transform="rotate(-25 9 14)"/>
    <ellipse cx="17" cy="9" rx="4" ry="6"/>
    <ellipse cx="26" cy="10" rx="4" ry="6"
      transform="rotate(15 26 10)"/>
    <ellipse cx="33" cy="17" rx="4" ry="5.5"
      transform="rotate(30 33 17)"/>
    <path d="M11 29c0-6 5-12 10-12s11 7 11 13c0 7-7 5-11 4-4 1-10 3-10-5z"/>
  </svg>
`;

function updateProgress() {
  $("progress").replaceChildren();

  rounds.forEach((round, number) => {
    const paw = document.createElement("span");
    paw.className = "paw";

    if (completed.has(number)) {
      paw.classList.add("done");
    } else if (number === index && !finished) {
      paw.classList.add("current");
    }

    paw.innerHTML = pawSvg;
    $("progress").append(paw);
  });

  $("progress").setAttribute(
    "aria-label",
    `Открыто ${completed.size} из ${rounds.length} животных`
  );
}

function loadImage(src) {
  if (imageCache.has(src)) return imageCache.get(src);

  const promise = new Promise(resolve => {
    const img = new Image();
    let settled = false;

    const done = result => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(result);
    };

    const timer = setTimeout(() => done(null), 10000);

    img.onload = () => done(img);
    img.onerror = () => done(null);
    img.src = src;
  });

  imageCache.set(src, promise);
  return promise;
}

rounds.forEach(round => loadImage(round.image));

function render() {
  opened = false;
  finished = false;
  busy = false;

  $("counter").textContent = `${index + 1} / ${rounds.length}`;

  $("board").innerHTML = `
    <div class="clues" id="clues"></div>

    <button
      class="answer"
      id="answer"
      aria-label="Открыть коробку">

      <span class="box-stage" aria-hidden="true">
        <span class="box-scene">
          <span class="box-hero"></span>
          <span class="box-lid"></span>
          <span class="box-body"></span>
        </span>
      </span>

      <span class="answer-label">Кто в коробке?</span>
      <span class="hint">Нажми на коробку</span>
      <span class="sparkles" aria-hidden="true"></span>
    </button>
  `;

  rounds[index].clues.forEach(word => {
    const element = document.createElement("div");
    element.className = "clue";
    element.textContent = word;
    $("clues").append(element);
  });

  $("next").disabled = true;
  $("next").textContent =
    index === rounds.length - 1 ? "Завершить →" : "Дальше →";

  $("back").disabled = index === 0;
  updateProgress();
}

function showSparkles(button) {
  const layer = button.querySelector(".sparkles");
  const colors = ["#f2ba45", "#a49ae9", "#79c4a3", "#ef9cb3"];

  const positions = [
    [22, 25], [76, 22], [16, 43], [84, 42],
    [30, 14], [66, 13], [24, 57], [77, 57]
  ];

  positions.forEach(([x, y], number) => {
    const spark = document.createElement("span");
    spark.className = "spark";
    spark.textContent = "✦";
    spark.style.left = `${x}%`;
    spark.style.top = `${y}%`;
    spark.style.setProperty("--color", colors[number % colors.length]);
    spark.style.setProperty("--size", `${18 + number % 3 * 5}px`);
    spark.style.setProperty("--delay", `${number * .045}s`);
    spark.style.setProperty("--dx", `${x < 50 ? -18 : 18}px`);
    spark.style.setProperty("--dy", "-22px");
    layer.append(spark);
  });

  setTimeout(() => layer.replaceChildren(), 1600);
}

async function openBox() {
  if (opened || busy || finished) return;

  busy = true;
  $("back").disabled = true;

  const round = rounds[index];
  const button = $("answer");
  const hint = button.querySelector(".hint");

  button.classList.add("loading");
  button.setAttribute("aria-label", "Загрузка картинки");

  const image = await loadImage(round.image);
  button.classList.remove("loading");

  if (!image) {
    hint.textContent =
      "Картинка не загрузилась. Нажми, чтобы повторить.";

    button.setAttribute("aria-label", "Повторить загрузку картинки");

    imageCache.delete(round.image);
    busy = false;
    $("back").disabled = index === 0;
    return;
  }

  const heroImage = image.cloneNode();
  heroImage.alt = round.answer;
  heroImage.draggable = false;

  button.querySelector(".box-hero").replaceChildren(heroImage);

  hint.textContent = "Кто же прячется внутри?";
  button.classList.add("shaking");
  button.setAttribute("aria-label", "Коробка открывается");

  await wait(650);

  button.classList.remove("shaking");
  button.classList.add("revealed");

  button.querySelector(".answer-label").textContent = round.answer;
  hint.textContent = "Вот кто прятался в коробке!";
  button.setAttribute("aria-label", `Ответ: ${round.answer}`);

  showSparkles(button);

  await wait(750);

  completed.add(index);
  opened = true;
  busy = false;
  updateProgress();

  $("next").disabled = false;
  $("back").disabled = index === 0;
}

$("board").addEventListener("click", event => {
  if (event.target.closest("#answer")) openBox();
});

$("next").addEventListener("click", () => {
  if (busy) return;

  if (finished) {
    index = 0;
    completed.clear();

    $("instruction").textContent =
      "Прочитай три слова. Назови героя и нажми на коробку.";

    render();
    return;
  }

  if (!opened) return;

  if (index < rounds.length - 1) {
    index++;
    render();
    return;
  }

  finished = true;
  updateProgress();

  $("counter").textContent = "Готово!";
  $("instruction").textContent = "Все загадки открыты!";

  $("board").innerHTML = `
    <div class="end">
      <div class="symbol">🎉</div>
      <h2>Молодец!</h2>
      <p>Ты нашёл всех животных!</p>
    </div>
  `;

  $("back").disabled = true;
  $("next").textContent = "Играть ещё";
});

$("back").addEventListener("click", () => {
  if (index > 0 && !finished && !busy) {
    index--;
    render();
  }
});

render();
</script>
</body>
</html>
