<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай по признакам</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  padding: 20px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: #23364e;
  background: #eaf4f8;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 4px solid #ffbc45;
  outline-offset: 5px;
}

.computer { width: min(100%, 1100px); }

.monitor {
  padding: 18px 18px 12px;
  background: #23364e;
  border-radius: 30px;
  box-shadow: 0 18px 45px #23364e22;
}

.screen {
  padding: 30px;
  background: #fafcff;
  border-radius: 18px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

h1 {
  margin: 0;
  font-size: clamp(23px, 3.6vw, 38px);
}

.counter {
  padding: 10px 18px;
  background: #eaf0ff;
  border-radius: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.instruction {
  margin: 14px 0 28px;
  font-size: clamp(16px, 2vw, 21px);
  color: #65758b;
  line-height: 1.4;
}

.board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 38px;
}

/* Плашки */

.clues {
  display: grid;
  gap: 16px;
}

.clue {
  padding: 20px 10px;
  text-align: center;
  font-size: clamp(22px, 3.5vw, 38px);
  font-weight: bold;
  background: #e8e8ff;
  border: 2px solid #d4d2ff;
  border-radius: 19px;
  overflow-wrap: anywhere;
}

.clue:nth-child(2) {
  background: #e4f5ee;
  border-color: #c5e9d9;
}

.clue:nth-child(3) {
  background: #fff0d6;
  border-color: #f7dfb4;
}

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .clue:hover {
    animation: clueShake .55s ease-in-out;
  }
}

@keyframes clueShake {
  0%, 100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-2px) rotate(-1deg); }
  40% { transform: translateX(2px) rotate(1deg); }
  60% { transform: translateX(-2px) rotate(-.7deg); }
  80% { transform: translateX(1px) rotate(.5deg); }
}

/* Область коробки */

.answer {
  position: relative;
  width: 100%;
  min-height: 390px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #23364e;
  background: #edf3ff;
  border: 0;
  border-radius: 24px;
  overflow: hidden;
}

.answer.revealed {
  background: #f3faf6;
  cursor: default;
}

.answer.shaking,
.answer.loading { cursor: wait; }

.answer-label {
  min-height: 42px;
  font-size: clamp(24px, 3vw, 35px);
  font-weight: bold;
}

.hint {
  min-height: 36px;
  font-size: 15px;
  color: #687b97;
  line-height: 1.3;
}

/* Размер всей сцены */

.box-stage {
  position: relative;
  width: 280px;
  height: 280px;
  flex-shrink: 0;
}

.box-scene {
  position: absolute;
  inset: 0;
}

/* Передняя стенка */

.box-body {
  position: absolute;
  z-index: 3;
  left: 40px;
  bottom: 0;
  width: 200px;
  height: 110px;
  background: #e9af68;
  border: 4px solid #bd7b3f;
  border-radius: 5px 5px 15px 15px;
  box-shadow: inset -18px 0 #d99a55;
}

.box-body::after {
  content: "?";
  position: absolute;
  inset: 10px;
  text-align: center;
  font-size: 65px;
  font-weight: bold;
  color: #fff3de;
}

/* Крышка */

.box-lid {
  position: absolute;
  z-index: 4;
  left: 30px;
  bottom: 102px;
  width: 220px;
  height: 32px;
  background: #f7c785;
  border: 4px solid #bd7b3f;
  border-radius: 7px;
  transform-origin: 10% 80%;
  transition: transform .5s ease, opacity .5s ease;
}

/* Размер и положение картинки героя */

.box-hero {
  position: absolute;
  z-index: 2;
  left: 20px;
  bottom: 20px;
  width: 240px;
  height: 220px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transform: translateY(65px) scale(.45);
  transform-origin: bottom center;
  transition: transform .75s ease-out, opacity .3s ease;
}

.box-hero img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.answer.revealed .box-hero {
  opacity: 1;
  transform: translateY(-65px) scale(1);
}

.answer.revealed .box-lid {
  transform: translate(-25px, -75px) rotate(-35deg);
  opacity: 0;
}

.answer.revealed .box-body::after {
  content: "★";
  font-size: 55px;
}

.shaking .box-scene {
  animation: boxShake .65s ease-in-out;
}

@keyframes boxShake {
  0%, 100% { transform: rotate(0); }
  15%, 45%, 75% {
    transform: translateX(-7px) rotate(-5deg);
  }
  30%, 60%, 90% {
    transform: translateX(7px) rotate(5deg);
  }
}

/* Навигация */

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-top: 28px;
}

.nav {
  padding: 14px 25px;
  font-size: 19px;
  font-weight: bold;
  color: white;
  background: #5b64dc;
  border: 0;
  border-radius: 14px;
}

.nav:disabled {
  opacity: .4;
  cursor: default;
}

.back {
  color: #354761;
  background: #e9edf4;
}

/* Подставка */

.led {
  width: 8px;
  height: 8px;
  margin: 10px auto 0;
  background: #a4e4bd;
  border-radius: 50%;
}

.stand {
  width: 110px;
  height: 35px;
  margin: auto;
  background: #23364e;
}

.base {
  width: 240px;
  height: 15px;
  margin: auto;
  background: #23364e;
  border-radius: 15px 15px 4px 4px;
}

/* Финальный экран */

.end {
  grid-column: 1 / -1;
  padding: 28px;
  text-align: center;
}

.symbol {
  font-size: 90px;
  line-height: 1.2;
}

.end h2 { font-size: 38px; }
.end p { font-size: 22px; }

@media (max-width: 700px) {
  body { padding: 10px; }

  .monitor {
    padding: 10px;
    border-radius: 20px;
  }

  .screen { padding: 18px; }
  header { align-items: flex-start; }

  .counter {
    padding: 8px;
    font-size: 13px;
  }

  .board { gap: 15px; }

  .clue {
    padding: 17px 5px;
    font-size: clamp(17px, 3.4vw, 24px);
  }

  .answer {
    min-height: 320px;
    padding: 8px;
  }

  .box-stage {
    width: 196px;
    height: 220px;
  }

  .box-scene {
    width: 280px;
    height: 280px;
    inset: auto;
    left: 50%;
    bottom: 0;
    margin-left: -140px;
    transform: scale(.7);
    transform-origin: bottom center;
  }

  .shaking .box-scene {
    animation-name: boxShakeSmall;
  }

  .answer-label {
    min-height: 30px;
    font-size: 23px;
  }

  .hint { font-size: 13px; }

  .nav {
    padding: 12px 16px;
    font-size: 16px;
  }

  .stand { height: 25px; }
}

@keyframes boxShakeSmall {
  0%, 100% { transform: scale(.7) rotate(0); }
  15%, 45%, 75% {
    transform: scale(.7) translateX(-7px) rotate(-5deg);
  }
  30%, 60%, 90% {
    transform: scale(.7) translateX(7px) rotate(5deg);
  }
}

@media (max-width: 430px) {
  .board { grid-template-columns: 1fr; }
  .clues { gap: 10px; }

  .clue {
    padding: 12px;
    font-size: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .shaking .box-scene { animation: none; }
  .box-lid, .box-hero { transition: none; }
}
</style>
</head>

<body>
<main class="computer">
  <div class="monitor">
    <section class="screen">
      <header>
        <h1>Угадай по признакам</h1>
        <span class="counter" id="counter"></span>
      </header>

      <p class="instruction" id="instruction">
        Прочитай три слова. Назови героя и нажми на коробку.
      </p>

      <div class="board" id="board"></div>

      <footer>
        <button class="nav back" id="back">Назад</button>
        <button class="nav" id="next" disabled>Дальше →</button>
      </footer>
    </section>
    <div class="led"></div>
  </div>

  <div class="stand"></div>
  <div class="base"></div>
</main>

<script>
// Картинки находятся в папке images.
// Имена файлов: pik-1.png ... pik-8.png.

const rounds = [
  {
    clues: ["Длинноухий", "Пугливый", "Прыткий"],
    answer: "Заяц",
    image: "images/pik-1.png"
  },
  {
    clues: ["Рыжая", "Хитрая", "Пушистая"],
    answer: "Лиса",
    image: "images/pik-2.png"
  },
  {
    clues: ["Серый", "Хищный", "Зубастый"],
    answer: "Волк",
    image: "images/pik-3.png"
  },
  {
    clues: ["Бурый", "Косолапый", "Крупный"],
    answer: "Медведь",
    image: "images/pik-4.png"
  },
  {
    clues: ["Маленький", "Колючий", "Сопящий"],
    answer: "Ёж",
    image: "images/pik-5.png"
  },
  {
    clues: ["Рыжая", "Прыгучая", "Запасливая"],
    answer: "Белка",
    image: "images/pik-6.png"
  },
  {
    clues: ["Полосатый", "Хищный", "Усатый"],
    answer: "Тигр",
    image: "images/pik-7.png"
  },
  {
    clues: ["Гривастый", "Могучий", "Грозный"],
    answer: "Лев",
    image: "images/pik-8.png"
  }
];

const $ = id => document.getElementById(id);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

let index = 0;
let opened = false;
let finished = false;
let busy = false;

// Предварительно загружаем картинки.

const imageCache = new Map();

function loadImage(src) {
  if (imageCache.has(src)) return imageCache.get(src);

  const promise = new Promise(resolve => {
    const img = new Image();
    let settled = false;

    const done = result => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(result);
    };

    const timer = setTimeout(() => done(null), 10000);

    img.onload = () => done(img);
    img.onerror = () => done(null);
    img.src = src;
  });

  imageCache.set(src, promise);
  return promise;
}

rounds.forEach(round => loadImage(round.image));

function render() {
  opened = false;
  finished = false;
  busy = false;

  $("counter").textContent = `${index + 1} / ${rounds.length}`;

  $("board").innerHTML = `
    <div class="clues" id="clues"></div>

    <button
      class="answer"
      id="answer"
      aria-label="Открыть коробку">
      <span class="box-stage" aria-hidden="true">
        <span class="box-scene">
          <span class="box-hero"></span>
          <span class="box-lid"></span>
          <span class="box-body"></span>
        </span>
      </span>

      <span class="answer-label">Кто в коробке?</span>
      <span class="hint">Нажми на коробку</span>
    </button>
  `;

  rounds[index].clues.forEach(word => {
    const element = document.createElement("div");
    element.className = "clue";
    element.textContent = word;
    $("clues").append(element);
  });

  $("next").disabled = true;
  $("next").textContent =
    index === rounds.length - 1 ? "Завершить →" : "Дальше →";

  $("back").disabled = index === 0;
}

async function openBox() {
  if (opened || busy || finished) return;

  busy = true;
  $("back").disabled = true;

  const round = rounds[index];
  const button = $("answer");
  const hint = button.querySelector(".hint");

  button.classList.add("loading");
  button.setAttribute("aria-label", "Загрузка картинки");

  const image = await loadImage(round.image);

  button.classList.remove("loading");

  if (!image) {
    hint.textContent =
      "Картинка не загрузилась. Нажми, чтобы повторить.";
    button.setAttribute("aria-label", "Повторить загрузку картинки");

    imageCache.delete(round.image);
    busy = false;
    $("back").disabled = index === 0;
    return;
  }

  const heroImage = image.cloneNode();
  heroImage.alt = round.answer;
  heroImage.draggable = false;
  button.querySelector(".box-hero").replaceChildren(heroImage);

  hint.textContent = "Кто же прячется внутри?";
  button.classList.add("shaking");
  button.setAttribute("aria-label", "Коробка открывается");

  await wait(650);

  button.classList.remove("shaking");
  button.classList.add("revealed");

  button.querySelector(".answer-label").textContent = round.answer;
  hint.textContent = "Вот кто прятался в коробке!";
  button.setAttribute("aria-label", `Ответ: ${round.answer}`);

  await wait(750);

  opened = true;
  busy = false;
  $("next").disabled = false;
  $("back").disabled = index === 0;
}

$("board").addEventListener("click", event => {
  if (event.target.closest("#answer")) openBox();
});

$("next").addEventListener("click", () => {
  if (busy) return;

  if (finished) {
    index = 0;
    $("instruction").textContent =
      "Прочитай три слова. Назови героя и нажми на коробку.";
    render();
    return;
  }

  if (!opened) return;

  if (index < rounds.length - 1) {
    index++;
    render();
    return;
  }

  finished = true;

  $("counter").textContent = "Готово!";
  $("instruction").textContent = "Все загадки открыты!";

  $("board").innerHTML = `
    <div class="end">
      <div class="symbol">🎉</div>
      <h2>Молодец!</h2>
      <p>Ты разгадал все загадки!</p>
    </div>
  `;

  $("back").disabled = true;
  $("next").textContent = "Играть ещё";
});

$("back").addEventListener("click", () => {
  if (index > 0 && !finished && !busy) {
    index--;
    render();
  }
});

render();
</script>
</body>
</html>
