<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай по признакам</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100svh;
  padding: 20px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: #23364e;
  background: #eaf4f8;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 4px solid #ffbc45;
  outline-offset: 5px;
}

.computer {
  width: min(100%, 1100px);
}

.monitor {
  padding: 18px 18px 12px;
  background: #23364e;
  border-radius: 30px;
  box-shadow: 0 18px 45px #23364e22;
}

.screen {
  min-height: 490px;
  padding: 30px;
  background: #fafcff;
  border-radius: 18px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

h1 {
  margin: 0;
  font-size: clamp(23px, 3.6vw, 38px);
}

.counter {
  padding: 10px 18px;
  background: #eaf0ff;
  border-radius: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.instruction {
  margin: 14px 0 28px;
  font-size: clamp(16px, 2vw, 21px);
  color: #65758b;
}

.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 38px;
}

/* Плашки с прилагательными */

.clues {
  display: grid;
  gap: 16px;
}

.clue {
  padding: 20px 10px;
  text-align: center;
  font-size: clamp(22px, 3.7vw, 38px);
  font-weight: bold;
  background: #e8e8ff;
  border: 2px solid #d4d2ff;
  border-radius: 19px;
  transform-origin: center;
}

.clue:nth-child(2) {
  background: #e4f5ee;
  border-color: #c5e9d9;
}

.clue:nth-child(3) {
  background: #fff0d6;
  border-color: #f7dfb4;
}

/* Лёгкая тряска при наведении мыши */

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .clue:hover {
    animation: clueShake 0.55s ease-in-out;
  }
}

@keyframes clueShake {
  0%, 100% {
    transform: translateX(0) rotate(0);
  }
  20% {
    transform: translateX(-2px) rotate(-1deg);
  }
  40% {
    transform: translateX(2px) rotate(1deg);
  }
  60% {
    transform: translateX(-2px) rotate(-0.7deg);
  }
  80% {
    transform: translateX(1px) rotate(0.5deg);
  }
}

/* Область с коробкой */

.answer {
  position: relative;
  overflow: hidden;
  width: 100%;
  min-height: 360px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #23364e;
  background: #edf3ff;
  border: 0;
  border-radius: 24px;
}

.answer.revealed {
  background: #f3faf6;
  cursor: default;
}

.answer.shaking {
  cursor: wait;
}

.answer-label {
  min-height: 42px;
  font-size: clamp(25px, 3vw, 35px);
  font-weight: bold;
}

.hint {
  font-size: 16px;
  color: #687b97;
}

/* Сцена сохраняет размер при открытии */

.box-stage {
  width: 220px;
  height: 250px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.box-scene {
  position: relative;
  width: 220px;
  height: 195px;
  flex-shrink: 0;
}

.box-body {
  position: absolute;
  z-index: 3;
  left: 20px;
  bottom: 0;
  width: 180px;
  height: 115px;
  background: #e9af68;
  border: 4px solid #bd7b3f;
  border-radius: 5px 5px 15px 15px;
  box-shadow: inset -18px 0 #d99a55;
}

.box-body::after {
  content: "?";
  position: absolute;
  inset: 12px;
  text-align: center;
  font-size: 65px;
  font-weight: bold;
  color: #fff3de;
}

.box-lid {
  position: absolute;
  z-index: 4;
  left: 10px;
  bottom: 106px;
  width: 200px;
  height: 32px;
  background: #f7c785;
  border: 4px solid #bd7b3f;
  border-radius: 7px;
  transform-origin: 10% 80%;
  transition: transform 0.5s, opacity 0.5s;
}

/* Герой */

.box-hero {
  position: absolute;
  z-index: 2;
  left: 0;
  bottom: 35px;
  width: 100%;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 100px;
  opacity: 0;
  transform: scale(0.5);
  transition: transform 0.65s ease-out, opacity 0.3s;
}

.box-hero img {
  height: 125px;
  max-width: 180px;
  object-fit: contain;
}

.answer.revealed .box-hero {
  opacity: 1;
  transform: translateY(-95px) scale(1);
}

.answer.revealed .box-lid {
  transform: translate(-25px, -65px) rotate(-35deg);
  opacity: 0;
}

.answer.revealed .box-body::after {
  content: "★";
  font-size: 55px;
}

/* Тряска коробки */

.shaking .box-scene {
  animation: boxShake 0.65s ease-in-out;
}

@keyframes boxShake {
  0%, 100% {
    transform: rotate(0);
  }
  15%, 45%, 75% {
    transform: translateX(-7px) rotate(-5deg);
  }
  30%, 60%, 90% {
    transform: translateX(7px) rotate(5deg);
  }
}

/* Кнопки */

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-top: 28px;
}

.nav {
  padding: 14px 25px;
  font-size: 19px;
  font-weight: bold;
  color: white;
  background: #5b64dc;
  border: 0;
  border-radius: 14px;
}

.nav:disabled {
  opacity: 0.4;
  cursor: default;
}

.back {
  color: #354761;
  background: #e9edf4;
}

/* Подставка компьютера */

.led {
  width: 8px;
  height: 8px;
  margin: 10px auto 0;
  background: #a4e4bd;
  border-radius: 50%;
}

.stand {
  width: 110px;
  height: 35px;
  margin: auto;
  background: #23364e;
}

.base {
  width: 240px;
  height: 15px;
  margin: auto;
  background: #23364e;
  border-radius: 15px 15px 4px 4px;
}

/* Финал */

.end {
  grid-column: 1 / -1;
  padding: 28px;
  text-align: center;
}

.symbol {
  font-size: 100px;
  line-height: 1.2;
}

.end h2 {
  font-size: 38px;
}

.end p {
  font-size: 22px;
}

/* Небольшие экраны */

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .monitor {
    padding: 10px;
    border-radius: 20px;
  }

  .screen {
    min-height: 0;
    padding: 18px;
  }

  header {
    align-items: flex-start;
  }

  .counter {
    padding: 8px;
    font-size: 13px;
  }

  .instruction {
    line-height: 1.4;
  }

  .board {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 15px;
  }

  .clue {
    padding: 17px 5px;
    font-size: clamp(15px, 3.5vw, 21px);
    overflow-wrap: anywhere;
  }

  .answer {
    min-height: 310px;
    padding: 8px;
  }

  .box-stage {
    width: 176px;
    height: 210px;
    max-width: 100%;
  }

  .box-scene {
    transform: scale(0.8);
    transform-origin: bottom center;
  }

  .shaking .box-scene {
    animation-name: boxShakeSmall;
  }

  .answer-label {
    min-height: 30px;
    font-size: 21px;
  }

  .hint {
    font-size: 13px;
  }

  .symbol {
    font-size: 70px;
  }

  .nav {
    padding: 12px 16px;
    font-size: 16px;
  }

  .stand {
    height: 25px;
  }
}

@keyframes boxShakeSmall {
  0%, 100% {
    transform: scale(0.8) rotate(0);
  }
  15%, 45%, 75% {
    transform: scale(0.8) translateX(-7px) rotate(-5deg);
  }
  30%, 60%, 90% {
    transform: scale(0.8) translateX(7px) rotate(5deg);
  }
}

@media (max-width: 360px) {
  .board {
    grid-template-columns: 1fr;
  }

  .clue {
    font-size: 22px;
    padding: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .shaking .box-scene {
    animation: none;
  }

  .box-lid,
  .box-hero {
    transition: none;
  }
}
</style>
</head>

<body>
<main class="computer">
  <div class="monitor">
    <section class="screen">
      <header>
        <h1>Угадай по признакам</h1>
        <span class="counter" id="counter"></span>
      </header>

      <p class="instruction" id="instruction">
        Прочитай три слова. Назови героя и нажми на коробку.
      </p>

      <div class="board" id="board">
        <div class="clues" id="clues"></div>

        <button
          class="answer"
          id="answer"
          aria-label="Открыть коробку">
        </button>
      </div>

      <footer>
        <button class="nav back" id="back">Назад</button>
        <button class="nav" id="next" disabled>Дальше →</button>
      </footer>
    </section>

    <div class="led"></div>
  </div>

  <div class="stand"></div>
  <div class="base"></div>
</main>

<script>
// =====================================================
// МЕНЯЙТЕ СЛОВА И ГЕРОЕВ ЗДЕСЬ
//
// clues  — три прилагательных
// answer — название героя
// emoji  — временная картинка
// image  — путь к вашей иллюстрации
//
// Пример: image: "images/zayats.png"
//
// Если image пустое, отображается эмодзи.
// =====================================================

const rounds = [
  {
    clues: ["Длинноухий", "Пугливый", "Прыткий"],
    answer: "Заяц",
    emoji: "🐰",
    image: ""
  },
  {
    clues: ["Рыжая", "Хитрая", "Пушистая"],
    answer: "Лиса",
    emoji: "🦊",
    image: ""
  },
  {
    clues: ["Серый", "Хищный", "Зубастый"],
    answer: "Волк",
    emoji: "🐺",
    image: ""
  },
  {
    clues: ["Бурый", "Косолапый", "Крупный"],
    answer: "Медведь",
    emoji: "🐻",
    image: ""
  },
  {
    clues: ["Маленький", "Колючий", "Сопящий"],
    answer: "Ёж",
    emoji: "🦔",
    image: ""
  },
  {
    clues: ["Рыжая", "Прыгучая", "Запасливая"],
    answer: "Белка",
    emoji: "🐿️",
    image: ""
  },
  {
    clues: ["Полосатый", "Хищный", "Усатый"],
    answer: "Тигр",
    emoji: "🐯",
    image: ""
  },
  {
    clues: ["Гривастый", "Могучий", "Грозный"],
    answer: "Лев",
    emoji: "🦁",
    image: ""
  }
];

let index = 0;
let opened = false;
let finished = false;
let busy = false;

const $ = id => document.getElementById(id);

const boxMarkup = `
  <span class="box-stage" aria-hidden="true">
    <span class="box-scene">
      <span class="box-hero"></span>
      <span class="box-lid"></span>
      <span class="box-body"></span>
    </span>
  </span>
  <span class="answer-label">Кто в коробке?</span>
  <span class="hint">Нажми на коробку</span>
`;

const boardMarkup = `
  <div class="clues" id="clues"></div>
  <button
    class="answer"
    id="answer"
    aria-label="Открыть коробку">
  </button>
`;

// Показ текущего раунда

function render() {
  finished = false;
  opened = false;
  busy = false;

  $("counter").textContent = `${index + 1} / ${rounds.length}`;

  const clueElements = rounds[index].clues.map(word => {
    const element = document.createElement("div");
    element.className = "clue";
    element.textContent = word;
    return element;
  });

  $("clues").replaceChildren(...clueElements);

  $("answer").className = "answer";
  $("answer").setAttribute("aria-label", "Открыть коробку");
  $("answer").innerHTML = boxMarkup;

  $("next").disabled = true;
  $("next").textContent =
    index === rounds.length - 1 ? "Завершить →" : "Дальше →";

  $("back").disabled = index === 0;
}

// Открытие коробки

function openBox() {
  if (opened || busy || finished) return;

  busy = true;
  const round = rounds[index];

  $("back").disabled = true;
  $("answer").classList.add("shaking");
  $("answer").setAttribute("aria-label", "Коробка открывается");

  setTimeout(() => {
    const hero = $("answer").querySelector(".box-hero");

    if (round.image) {
      const img = document.createElement("img");
      img.alt = round.answer;

      img.onerror = () => {
        hero.textContent = round.emoji || "⭐";
      };

      img.src = round.image;
      hero.append(img);
    } else {
      hero.textContent = round.emoji || "⭐";
    }

    $("answer").classList.remove("shaking");

    // Даём браузеру отобразить героя в начальном положении.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        $("answer").classList.add("revealed");

        $("answer").querySelector(".answer-label").textContent =
          round.answer;

        $("answer").querySelector(".hint").textContent =
          "Вот кто прятался в коробке!";

        $("answer").setAttribute(
          "aria-label",
          `Ответ: ${round.answer}`
        );

        setTimeout(() => {
          opened = true;
          busy = false;
          $("next").disabled = false;
          $("back").disabled = index === 0;
        }, 650);
      });
    });
  }, 650);
}

// Делегирование сохраняет обработчик после перезапуска игры.

$("board").addEventListener("click", event => {
  if (event.target.closest("#answer")) {
    openBox();
  }
});

// Следующий раунд и финал

$("next").addEventListener("click", () => {
  if (finished) {
    index = 0;
    $("board").innerHTML = boardMarkup;
    $("instruction").textContent =
      "Прочитай три слова. Назови героя и нажми на коробку.";
    render();
    return;
  }

  if (!opened || busy) return;

  if (index < rounds.length - 1) {
    index++;
    render();
    return;
  }

  finished = true;

  $("counter").textContent = "Готово!";
  $("instruction").textContent = "Все загадки открыты!";

  $("board").innerHTML = `
    <div class="end">
      <div class="symbol">🎉</div>
      <h2>Молодец!</h2>
      <p>Ты разгадал все загадки!</p>
    </div>
  `;

  $("back").disabled = true;
  $("next").textContent = "Играть ещё";
});

// Предыдущий раунд

$("back").addEventListener("click", () => {
  if (index > 0 && !finished && !busy) {
    index--;
    render();
  }
});

render();
</script>
</body>
</html>
